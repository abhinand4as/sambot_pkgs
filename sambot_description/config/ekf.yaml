### ekf config file ###
# robot_localization EKF node fuses wheel odometry and IMU to produce a
# smooth, continuous odom→base_link transform on /odometry/filtered.
# The Gazebo DiffDrive plugin also broadcasts odom→base_link via /tf, but
# that bridge is intentionally disabled in bridge_config.yaml so that this
# EKF owns the transform exclusively.
ekf_filter_node:
    ros__parameters:
        # Output rate of the filtered pose estimate (Hz).
        # Higher = smoother but more CPU. 30 Hz matches the IMU-dominant sources.
        frequency: 30.0

        # Set true for robots that operate on a flat floor (2D motion only).
        # This ignores small Z/roll/pitch variations (e.g. from an IMU sensing
        # gravity components) and produces a cleaner XY + yaw estimate.
        # Sambot is a ground robot so this must be true.
        two_d_mode: true

        # Publish linear acceleration in the output Odometry message.
        publish_acceleration: true

        # Broadcast the odom→base_link transform on /tf.
        # Set false if another node (e.g. AMCL) should own this transform.
        publish_tf: true

        # Frame definitions.
        # world_frame = odom_frame → continuous dead-reckoning mode (no global
        # corrections). SLAM/AMCL supplies the map→odom jump separately.
        # To use a GPS or global pose source, set world_frame: map and run a
        # second EKF instance for the odom→base_link leg.
        map_frame: map              # Defaults to "map" if unspecified
        odom_frame: odom            # Defaults to "odom" if unspecified
        base_link_frame: base_link  # Defaults to "base_link" if unspecified
        world_frame: odom           # Defaults to the value of odom_frame if unspecified

        # ── Odometry source ──────────────────────────────────────────────────
        # /demo/odom is the raw wheel odometry from the Gazebo DiffDrive plugin,
        # bridged to ROS via ros_gz_bridge (see bridge_config.yaml).
        odom0: /demo/odom
        # State vector columns: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
        # We fuse:
        #   vx    (forward velocity)        — primary locomotion signal
        #   vy    (lateral velocity, ~0)    — fusing zero keeps the EKF from
        #                                     drifting sideways in simulation
        #   vyaw  (yaw rate)                — differential drive turning
        # Absolute x/y positions are NOT fused from odometry to avoid double-
        # counting: the EKF integrates velocity internally.
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  true,  false,
                       false, false, true,
                       false, false, false]

        # ── IMU source ───────────────────────────────────────────────────────
        # /demo/imu is published by the Gazebo IMU sensor on imu_link at 100 Hz.
        imu0: /demo/imu
        # We only fuse vyaw (z angular velocity) from the IMU.
        # - Orientation is excluded because two_d_mode=true already constrains
        #   roll/pitch, and sim-IMU yaw adds noise relative to odometry.
        # - Linear acceleration is excluded to keep the filter simple; enable
        #   ax/ay here if you want the EKF to estimate slip or external forces.
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]
